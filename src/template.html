<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SVG Forge — 이미지·글자를 SVG · DXF · STL로</title>
<style>
:root{
  --bg:#f3f4f7; --card:#fff; --ink:#1c2230; --sub:#5d6678; --line:#dfe3ea; --pri:#1d5fd6; --pri-ink:#fff; --pri-soft:#e8f0fd; --warn:#8a4f00; --warn-bg:#fff4dd;
  --radius:10px; --gap:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 "Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden}
.hide{display:none!important}

/* 상단 바: 모드 전환 + 내보내기 */
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 6px 0 2px;letter-spacing:-.2px;white-space:nowrap}
.spacer{flex:1}
.tabs{display:flex;gap:3px;background:#eceff4;padding:3px;border-radius:8px}
.tabs button{white-space:nowrap;border:0;background:transparent;padding:5px 12px;border-radius:6px;font:inherit;color:var(--sub);cursor:pointer}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.exports{display:flex;gap:6px;align-items:center}
button.btn{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--ink);white-space:nowrap}
button.btn:hover:not(:disabled){border-color:#b9c2d3;background:#fafbfd}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);font-weight:600}
button.pri:hover:not(:disabled){background:#1852b8;border-color:#1852b8}
button.small{padding:4px 8px;font-size:12px}
.exports .lbl{color:var(--sub);font-size:12px;margin-right:2px}
.proj{gap:4px}
select.lang{width:auto;padding:3px 4px;font-size:12px}
.empty .resume{margin-top:12px}

/* 본문: 설정 | 미리보기 | 출력 */
main{flex:1;min-height:0;display:grid;grid-template-columns:292px minmax(0,1fr) 236px;gap:var(--gap);padding:var(--gap)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;overflow:auto;min-height:0}
.panel h2{font-size:12px;margin:10px 0 4px;color:var(--sub);font-weight:600;letter-spacing:.2px;text-transform:none}
.panel h2:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:6px;margin:5px 0;min-height:28px}
.row label{flex:0 0 78px;color:var(--sub);font-size:12.5px;white-space:nowrap}
.row .grow{flex:1;min-width:0}
input[type=range]{width:100%;margin:0}
input[type=number],select,textarea{font:inherit;color:inherit;border:1px solid var(--line);border-radius:7px;padding:4px 7px;background:#fff;width:100%}
textarea{resize:vertical;min-height:56px;max-height:160px}
.val{flex:0 0 34px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums;font-size:12px}
.chk{display:flex;align-items:center;gap:6px;color:var(--sub);font-size:12px;margin:3px 0;min-height:22px}
.chk input{margin:0}
.row input.mini{width:58px;flex:0 0 auto}
.row input[type=color]{width:34px;height:28px;padding:1px;border:1px solid var(--line);border-radius:6px;background:#fff;flex:0 0 auto}
.sub{margin:0 0 4px 12px}
.sub .row label{flex-basis:66px}
.hlabel{color:var(--sub);font-size:12.5px;margin:1px 0 2px;display:flex;align-items:center;white-space:nowrap}
.hchips{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-bottom:0}
.hchip{display:flex;align-items:center;gap:3px;border:1px solid var(--line);border-radius:7px;padding:2px 3px 2px 4px;background:#fafbfd}
.hchip .sw{margin:0}
.hchip input{width:100%;min-width:0;padding:2px 3px;font-size:12px}
.chkgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 6px}
.hint{color:var(--sub);font-size:11.5px;margin:2px 0 0}
.filebar{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#drop{flex:0 0 auto}
#fileName{flex:1;min-width:0;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out{font-variant-numeric:tabular-nums}

/* 미리보기 */
section.stage{display:flex;flex-direction:column;min-width:0;min-height:0}
.stagebar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.view{flex:1;min-height:0;border:1px solid var(--line);border-radius:var(--radius);position:relative;overflow:hidden;
  background:conic-gradient(#eff1f5 25%,#fff 0 50%,#eff1f5 0 75%,#fff 0) 0 0/20px 20px}
#view2d{display:flex;align-items:center;justify-content:center;padding:20px}
#view2d svg{width:100%;height:100%;shape-rendering:geometricPrecision}
#view3d{background:linear-gradient(#eef1f6,#dde3ee)}
#view3d canvas{display:block;width:100%;height:100%}
.empty{color:var(--sub);text-align:center;padding:20px;line-height:1.7}
.empty b{color:var(--ink);font-size:15px}
.empty.clickable{cursor:pointer;border:1.5px dashed #b7c0d1;border-radius:12px;padding:28px 36px;background:rgba(255,255,255,.85)}
.empty.clickable:hover{border-color:var(--pri);background:#fff}
body.dragging .view::after{content:attr(data-drop);position:absolute;inset:8px;border:2px dashed var(--pri);border-radius:10px;
  background:rgba(232,240,253,.85);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;color:var(--pri)}
#msg{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none;z-index:2}
.note{background:var(--warn-bg);color:var(--warn);border:1px solid #f1d9a8;border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stagewrap{flex:1;min-height:0;position:relative;display:flex}
.stagewrap .view{flex:1}
.statusbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;color:var(--sub);font-size:12px;min-height:20px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25);vertical-align:-2px;margin-right:3px}
.viewtools{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;z-index:3}
.viewtools .btn{background:rgba(255,255,255,.92)}
.charchips{display:flex;flex-wrap:wrap;gap:3px;max-height:88px;overflow:auto;margin:2px 0}
.chchip{font:inherit;min-width:26px;height:26px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer;padding:0 4px;position:relative}
.chchip.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);font-weight:700}
.chchip.mod::after{content:"";position:absolute;right:2px;top:2px;width:5px;height:5px;border-radius:50%;background:#e0891a}
#view2d text.edit{cursor:pointer}
.dl.edit{pointer-events:auto;cursor:pointer}
.dl.edit:hover{outline:2px solid var(--pri)}
input.numedit{position:fixed;z-index:50;width:80px;transform:translate(-50%,-50%);font:600 13px system-ui;padding:3px 6px;border:2px solid var(--pri);border-radius:6px}
#dimsBtn.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
:root{--dim:#1d5fd6;--dim-fs:11.5px}
#view2d[data-bg=white]{background:#fff}
#view2d[data-bg=gray]{background:#dfe2e8}
#view3d[data-bg=dark]{background:linear-gradient(#323845,#1c2028)}
dialog#prefs{border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:330px;box-shadow:0 10px 40px rgba(0,0,0,.2);color:var(--ink);font:inherit}
dialog#prefs::backdrop{background:rgba(20,25,35,.25)}
dialog#prefs h3{margin:0 0 8px;font-size:15px}
dialog#prefs .row label{flex-basis:70px}
#cube{position:absolute;right:8px;top:8px;width:84px;height:84px;z-index:1}
#cube .face{width:48px;height:48px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#3b4456;
  background:rgba(250,251,253,.93);border:1px solid #aab3c3;cursor:pointer;user-select:none;box-sizing:border-box}
#cube .face:hover{background:var(--pri-soft);color:var(--pri);border-color:var(--pri)}
#dimLabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.dl{position:absolute;transform:translate(-50%,-50%);font:600 var(--dim-fs)/1.2 system-ui,sans-serif;padding:1px 5px;border-radius:5px;white-space:nowrap;
  background:rgba(255,255,255,.92);color:var(--dim);border:1px solid var(--dim)}
.dl.h{border-width:2px}
#view2d.zoomable{cursor:grab}
#view2d.panning{cursor:grabbing}
.badge3d{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--sub)}

/* 낮은 화면(노트북 1366×768 등): 간격을 더 줄임 */
@media (max-height:760px){
  .row{margin:2px 0;min-height:26px}
  .panel h2{margin:6px 0 2px}
  header{padding:6px 10px}
}
/* 좁은 화면: 출력 설정을 미리보기 아래 한 줄로 */
@media (max-width:1150px){
  main{grid-template-columns:270px minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #panelIn{grid-column:1;grid-row:1 / span 2}
  section.stage{grid-column:2;grid-row:1}
  #panelOut{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap;align-items:center;gap:2px 14px;padding:6px 10px;overflow:visible}
  #panelOut h2,#panelOut .hint{display:none}
  #panelOut .row{margin:0}
  #panelOut .row label{flex-basis:auto}
  #panelOut .row input{width:80px;flex:0 0 auto}
  #panelOut .row select{width:100px;flex:0 0 auto}
  #panelOut .row input[type=checkbox]{width:auto}
  #panelOut .sub{margin:0}
  .exports .lbl{display:none}
}
/* 태블릿·휴대폰: 세로로 쌓고 스크롤 허용 */
@media (max-width:760px){
  body{overflow:auto;height:auto}
  html,body{height:auto}
  header{flex-wrap:wrap}
  .exports{flex-wrap:wrap}
  main{display:flex;flex-direction:column}
  section.stage{min-height:360px;order:-1}
  .panel{overflow:visible}
}
</style>
</head>
<body>
<header>
  <h1>SVG Forge</h1>
  <div class="tabs" id="modeTabs">
    <button id="modeImage" class="on">이미지</button>
    <button id="modeText">글자</button>
  </div>
  <div class="exports proj">
    <span class="lbl">프로젝트</span>
    <button class="btn small" id="projOpen" title="프로젝트 파일(.svgforge) 열기 — 저장했던 작업을 그대로 이어서 수정">열기</button>
    <button class="btn small" id="projSave" title="지금 작업(설정·이미지·글자·폰트·높이·고리 위치)을 .svgforge 파일로 저장">저장</button>
    <input id="projFile" type="file" accept=".svgforge,.json" class="hide">
  </div>
  <div class="spacer"></div>
  <div class="exports">
    <span class="lbl">저장</span>
    <button class="btn pri" id="btnFill" disabled title="MakerLab·3D용: 닫힌 채움 경로만, 선·글꼴 없음, mm 단위">SVG · MakerLab</button>
    <button class="btn" id="btnLaser" disabled title="레이저용: 채움 없이 0.1mm 윤곽선, 색상=레이어 (LightBurn)">SVG · 레이저</button>
    <button class="btn" id="btnDxf" disabled title="DXF R12, 단위 mm, 색상별 레이어 (RDWorks·LightBurn)">DXF</button>
    <label class="chk" style="margin:0 6px 0 0;font-size:11.5px" title="레이저 SVG·DXF에서 모든 색을 한 레이어(CUT)로 합칩니다"><input type="checkbox" id="laserSingle"> 한 레이어</label>
    <button class="btn" id="btnStl" disabled title="바이너리 STL, 오른쪽 '3D 출력'의 두께로 압출 (모든 파트 한 파일)">STL</button>
    <button class="btn" id="btn3mf" disabled title="3MF: 색·받침판·고리가 각각 파트로 나뉨 (Bambu Studio·OrcaSlicer 필라멘트 지정용)">3MF</button>
  </div>
  <select id="langSel" class="lang" aria-label="화면 언어" title="화면 언어"><option value="ko">한국어</option><option value="en">English</option></select>
  <button class="btn small" id="prefsBtn" title="설정 (치수 색·배경·도움말 등)" aria-label="설정">⚙</button>
</header>

<main>
  <aside class="panel" id="panelIn">
    <div id="paneImage">
      <div class="filebar">
        <button class="btn small" id="drop" title="이미지를 화면 아무 곳에나 끌어다 놓거나 Ctrl+V로 붙여넣어도 됩니다">이미지 열기…</button>
        <span id="fileName">끌어놓기 · 붙여넣기(Ctrl+V) 가능</span>
      </div>
      <input id="file" type="file" accept="image/*,.svg" class="hide">
      <h2>색·영역</h2>
      <div class="row"><label for="colors">색 수</label>
        <select id="colors" class="grow">
          <option value="1" selected>1색 (흑백, 임계값)</option>
          <option value="2">2색</option><option value="3">3색</option><option value="4">4색</option>
          <option value="5">5색</option><option value="6">6색</option><option value="8">8색</option>
        </select>
      </div>
      <div class="row" id="thrRow"><label for="thr">임계값</label>
        <input id="thr" class="grow" type="range" min="1" max="254" value="128"><span class="val" id="thrVal">128</span>
        <button class="btn small" id="thrAuto" title="자동 임계값(Otsu)">자동</button>
      </div>
      <label class="chk" id="invertRow"><input type="checkbox" id="invert"> 밝은 부분을 도형으로 (반전)</label>
      <label class="chk hide" id="bgRow"><input type="checkbox" id="removeBg" checked> 배경색(모서리 색) 제거</label>
      <h2>선 품질</h2>
      <div class="row" id="engineRow"><label for="engine" title="Potrace: 널리 쓰이는 오픈소스 트레이서(GPL-2.0). 흑백 전용, 디자인 보정은 적용되지 않음">엔진</label>
        <select id="engine" class="grow">
          <option value="forge" selected>SVG Forge (기본)</option>
          <option value="potrace">Potrace (GPL, 흑백)</option>
        </select></div>
      <div class="row"><label for="tres" title="작을수록 원본에 가깝고, 클수록 노드가 적고 매끈합니다">곡선 허용오차</label>
        <input id="tres" class="grow" type="range" min="0.1" max="3" step="0.05" value="0.4"><span class="val" id="tresVal">0.40</span></div>
      <div class="row"><label for="corner" title="이보다 크게 꺾이는 곳을 뾰족한 모서리로 만듭니다. 작을수록 모서리가 많아집니다">모서리 각도</label>
        <input id="corner" class="grow" type="range" min="15" max="120" step="5" value="40"><span class="val" id="cornerVal">40°</span></div>
      <div class="row"><label for="lineTol" title="이 편차(px) 안에서 곧게 뻗은 부분을 정확한 직선으로 바꿉니다. 0이면 끔">직선 인식</label>
        <input id="lineTol" class="grow" type="range" min="0" max="3" step="0.1" value="1"><span class="val" id="lineTolVal">1.0</span></div>
      <h2>디자인 보정</h2>
      <div class="chkgrid">
        <label class="chk" title="3° 이내로 기운 직선을 정확히 수평·수직으로"><input type="checkbox" id="axisSnap" checked> 수평·수직</label>
        <label class="chk" title="원과 원호를 정확한 원으로 (DXF는 호로 저장)"><input type="checkbox" id="optArcs" checked> 원·호</label>
        <label class="chk" title="거의 평행한 직선들의 각도를 하나로"><input type="checkbox" id="optParallel" checked> 평행</label>
        <label class="chk" title="비슷한 두께의 획을 같은 두께로"><input type="checkbox" id="optWidth" checked> 같은 두께</label>
        <label class="chk" title="거의 일직선인 선(기준선 등)을 한 줄로"><input type="checkbox" id="optAlign" checked> 일직선 정렬</label>
        <label class="chk" title="그림 전체가 좌우 대칭에 가까우면 완전한 대칭으로 (흑백 모드)"><input type="checkbox" id="optSym"> 좌우 대칭</label>
      </div>
      <h2>정리</h2>
      <div class="row"><label for="omit" title="이 면적(px²)보다 작은 조각을 지웁니다">노이즈 제거</label>
        <input id="omit" class="grow" type="range" min="0" max="200" step="2" value="12"><span class="val" id="omitVal">12</span></div>
      <div class="row" id="blurRow"><label for="blur" title="JPG 잡티·거친 가장자리를 다듬습니다">번짐 완화</label>
        <input id="blur" class="grow" type="range" min="0" max="5" step="1" value="0"><span class="val" id="blurVal">0</span></div>
      <div class="row"><label for="upscale" title="작거나 흐린 이미지를 AI로 선명하게 키운 뒤 트레이싱합니다 (처음 한 번은 몇 초 걸림)">AI 업스케일</label>
        <select id="upscale" class="grow">
          <option value="1" selected>끔</option>
          <option value="2">×2</option>
          <option value="4">×4 (작은 이미지)</option>
        </select></div>
      <label class="chk" title="가장자리는 유지하고 JPG 잡티·얼룩만 지웁니다"><input type="checkbox" id="denoise"> 잡티 제거 (가장자리 보존)</label>
      <div class="row"><label for="res" title="트레이싱할 때의 이미지 크기. 높을수록 정밀하지만 느립니다">해상도</label>
        <select id="res" class="grow">
          <option value="500">낮음 (500px, 빠름)</option>
          <option value="800" selected>보통 (800px)</option>
          <option value="1200">높음 (1200px)</option>
          <option value="1600">매우 높음 (1600px)</option>
        </select></div>
    </div>

    <div id="paneText" class="hide">
      <h2>글자</h2>
      <textarea id="text" placeholder="글자를 입력하세요 (여러 줄 가능)">글자 입력</textarea>
      <h2>폰트</h2>
      <div class="row"><select id="fontSel" class="grow" aria-label="폰트"><option value="builtin">Noto Sans KR Bold (내장)</option></select></div>
      <div class="row">
        <button class="btn small" id="fontFileBtn">폰트 파일…</button>
        <button class="btn small hide" id="fontLocalBtn">설치된 폰트…</button>
        <input id="fontFile" type="file" accept=".ttf,.otf,.woff,.ttc" multiple class="hide">
      </div>
      <div class="row hide" id="localFontRow"><select id="localFontSel" class="grow" aria-label="설치된 폰트"></select></div>
      <div class="row">
        <button class="btn small" id="fontDefault" title="지금 선택한 폰트를 다음에 열 때도 기본으로 선택">기본으로</button>
        <button class="btn small" id="fontRemove" title="기억해 둔 폰트를 이 브라우저에서 지웁니다">목록에서 빼기</button>
      </div>
      <p class="hint" id="fontHint">폰트 파일(.ttf .otf .woff .ttc)을 화면에 끌어다 놓아도 됩니다. 불러온 폰트는 이 브라우저에 기억됩니다.</p>
      <h2>배치</h2>
      <div class="row"><label for="align">정렬</label>
        <select id="align" class="grow"><option value="center">가운데</option><option value="left">왼쪽</option><option value="right">오른쪽</option></select></div>
      <div class="row"><label for="lineH">줄 간격</label>
        <input id="lineH" class="grow" type="range" min="0.8" max="2" step="0.05" value="1.2"><span class="val" id="lineHVal">1.20</span></div>
      <h2>글자별 조절</h2>
      <div id="charChips" class="charchips"></div>
      <p class="hint" id="charHint">글자를 고르거나 미리보기에서 글자를 눌러 끌면 옮겨집니다 (방향키로 미세 이동).</p>
      <div id="charEdit" class="hide">
        <div class="row"><label for="chScale">크기</label>
          <input id="chScale" class="grow" type="range" min="30" max="300" step="5" value="100"><span class="val" id="chScaleVal">100%</span></div>
        <div class="row"><label for="chDz" title="기본 두께에 더할 높이 (mm, 음수 가능)">높이 ±mm</label>
          <input id="chDz" class="mini" type="number" min="-50" max="50" step="0.2" value="0">
          <input id="chColor" type="color" value="#000000" title="글자 색 (3MF에서 필라멘트 구분)">
          <button class="btn small" id="chReset" title="이 글자를 처음대로">↺</button></div>
        <div class="row"><label title="가로 · 세로 이동 (mm, +오른쪽 · +위)">이동 mm</label>
          <input id="chDx" class="mini" type="number" step="0.5" value="0" title="가로 (mm, +오른쪽)">
          <input id="chDy" class="mini" type="number" step="0.5" value="0" title="세로 (mm, +위)"></div>
      </div>
      <button class="btn small hide" id="chResetAll">모든 글자 처음대로</button>
    </div>
  </aside>

  <section class="stage">
    <div class="stagebar">
      <div class="tabs"><button id="tab2d" class="on">2D</button><button id="tab3d">3D</button></div>
      <div id="modeView2d" class="tabs">
        <button id="v2Fill" class="on">채움</button><button id="v2Line">윤곽선</button>
      </div>
      <div class="spacer"></div>
    </div>
    <div class="stagewrap">
      <div class="view" id="view2d"><div class="empty">미리보기가 여기에 나타납니다.</div></div>
      <div class="view hide" id="view3d"><div class="badge3d" id="badge3d"></div><div id="cube" title="면을 누르면 그 방향에서 봅니다"></div><div id="dimLabels"></div></div>
      <div id="msg"></div>
      <div class="viewtools">
        <button class="btn small" id="dimsBtn" title="치수 보이기·숨기기 (단축키 D). 치수 숫자를 누르면 바로 고칠 수 있음">📏 치수</button>
        <button class="btn small" id="homeBtn" title="처음 보기로 (확대·회전 되돌리기, 단축키 H)">⌂ 처음으로</button>
      </div>
    </div>
    <div class="statusbar" id="status"></div>
  </section>

  <aside class="panel" id="panelOut">
    <h2>크기</h2>
    <div class="row"><label for="width">너비 (mm)</label><input id="width" class="mini" type="number" min="1" max="1000" step="0.5" value="50">
      <span class="out" style="color:var(--sub);font-size:12px;white-space:nowrap">높이 <span id="heightOut">-</span></span></div>
    <div class="row"><label for="tol" title="DXF·STL은 곡선을 직선으로 나눌 때 이 오차 이내로 맞춥니다">곡선 정밀도</label>
      <select id="tol" class="grow">
        <option value="0.02">0.02 mm</option>
        <option value="0.05" selected>0.05 mm</option>
        <option value="0.1">0.1 mm</option>
        <option value="0.2">0.2 mm</option>
      </select></div>
    <h2>3D 출력 (STL·3MF)</h2>
    <div class="row"><label for="thick" title="글자·색 기본 두께 (mm)">두께 (mm)</label>
      <input id="thick" class="mini" type="number" min="0.2" max="200" step="0.2" value="3" title="기본 두께 (mm)"></div>
    <div class="hlabel" title="색마다 기본 두께에 더할 높이 (mm). 음수면 낮아짐 (최소 0.2mm)">색별 높이 ±mm
      <button class="btn small" id="stepAuto" style="margin-left:6px;padding:1px 7px" title="밝기 순서대로 계단식 높이차를 채움 (0, +0.4, +0.8 …)">계단</button>
      <button class="btn small" id="stepZero" style="padding:1px 7px" title="색별 높이차를 모두 0으로">0으로</button></div>
    <div id="colorHeights" class="hchips" title="색마다 기본 두께에 더할 높이 (mm). 음수면 낮아짐 (최소 0.2mm)"></div>
    <div class="row"><label for="edgeType" title="윗모서리 다듬기" style="flex-basis:auto;margin-right:4px">모서리</label>
      <select id="edgeType" class="grow"><option value="none" selected>그대로</option><option value="chamfer">모따기</option><option value="fillet">모깎기</option></select>
      <input id="edgeSize" class="mini" type="number" min="0.1" max="10" step="0.1" value="0.6" title="크기 (mm)"></div>
    <div class="row hide" id="edgeOpts" style="margin-left:12px">
      <label class="chk" style="margin:0 10px 0 0"><input type="checkbox" id="edgeColor" checked> 글자·색</label>
      <label class="chk" style="margin:0"><input type="checkbox" id="edgeBase" checked> 받침·턱</label></div>
    <label class="chk"><input type="checkbox" id="baseOn"> 받침판</label>
    <div id="baseOpts" class="sub hide">
      <div class="row"><label for="baseShape">모양</label>
        <select id="baseShape" class="grow"><option value="outline">외곽 따라</option><option value="rect">둥근 사각형</option><option value="square">각진 사각형</option><option value="circle">원</option><option value="ellipse">타원</option><option value="triangle">삼각형</option><option value="pentagon">오각형</option><option value="hexagon">육각형</option><option value="octagon">팔각형</option><option value="star">별</option><option value="heart">하트</option><option value="cloud">구름</option><option value="flower">꽃</option><option value="shield">방패</option><option value="custom">내 이미지 (SVG·PNG)…</option><option value="imgsil">불러온 이미지 모양 그대로</option></select>
        <input id="baseColor" type="color" value="#ffffff" title="받침판 색 (3MF 필라멘트 구분용)"></div>
      <div class="row"><label title="여백 · 두께 (mm)">여백·두께</label>
        <input id="baseMargin" class="mini" type="number" min="0" max="50" step="0.5" value="2" title="여백 (mm)">
        <input id="baseH" class="mini" type="number" min="0.2" max="20" step="0.2" value="1.5" title="두께 (mm)"></div>
      <div class="row" id="baseFillRow"><label id="baseFillLbl" title="외곽 따라: 글자 사이·u 안쪽처럼 오목한 홈을 이 반경(mm)까지 메워 매끈하게">외곽 메움</label>
        <input id="baseFill" class="mini" type="number" min="0" max="30" step="0.5" value="3" title="메움 반경 (mm), 0이면 메우지 않음">
        <button class="btn small" id="baseImgBtn" title="SVG·PNG 그림의 외곽을 받침판 모양으로 씁니다">모양 이미지…</button>
        <label class="chk" id="baseStretchLbl" style="margin:0;flex:0 0 auto" title="모양을 글자 가로세로 비율에 맞게 늘입니다"><input type="checkbox" id="baseStretch"> 늘여 맞춤</label>
        <input id="baseImgFile" type="file" accept="image/*,.svg" class="hide"></div>
      <div class="row"><label for="textMode" title="받침판 위 글자·그림을 어떻게 만들지">글자</label>
        <select id="textMode" class="grow">
          <option value="emboss">돌출 (볼록)</option>
          <option value="emboss_cut">돌출 + 안쪽(o·e) 뚫기</option>
          <option value="engrave">새김 (두께 = 깊이)</option>
          <option value="through">관통 (뚫기)</option>
        </select></div>
      <label class="chk"><input type="checkbox" id="borderOn"> 테두리 턱</label>
      <div class="row hide" id="borderOpts"><label title="턱 폭 · 받침판 위 높이 (mm)">폭·높이</label>
        <input id="borderW" class="mini" type="number" min="0.4" max="20" step="0.2" value="1.2" title="폭 (mm)">
        <input id="borderH" class="mini" type="number" min="0.2" max="20" step="0.2" value="1" title="높이 (mm)"></div>
    </div>
    <div class="row" style="margin:1px 0"><label class="chk" style="flex:0 0 auto;margin:0"><input type="checkbox" id="ringOn"> 키링 고리</label>
      <select id="ringSel" class="grow" style="padding:4px 2px" title="편집할 고리·구멍 선택" aria-label="편집할 고리"></select>
      <button class="btn small" id="ringAdd" title="고리·구멍 하나 더 만들기" style="padding:3px 7px">＋</button>
      <button class="btn small" id="ringDel" title="선택한 고리·구멍 지우기" style="padding:3px 7px">－</button></div>
    <div id="ringOpts" class="sub hide">
      <div class="row"><label for="ringType">종류·위치</label>
        <select id="ringType" style="flex:0 0 60px;padding:4px 3px" title="고리: 몸체 밖에 고리를 붙임 · 구멍: 몸체 안에 구멍만 뚫음"><option value="tab">고리</option><option value="hole">구멍</option></select>
        <select id="ringPos" class="grow" aria-label="위치"><option value="top">위</option><option value="bottom">아래</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="topleft">왼쪽 위</option><option value="topright">오른쪽 위</option><option value="bottomleft">왼쪽 아래</option><option value="bottomright">오른쪽 아래</option></select></div>
      <div class="row"><label title="고리 바깥 지름 · 구멍 지름 (mm)">외경·구멍</label>
        <input id="ringOuter" class="mini" type="number" min="3" max="40" step="0.5" value="8" title="바깥 지름 (mm)">
        <input id="ringHole" class="mini" type="number" min="1" max="30" step="0.5" value="4" title="구멍 지름 (mm)"></div>
      <div class="row" title="자동 위치에서 옮긴 거리 (mm). 3D 화면에서 고리를 마우스로 끌어도 됩니다"><label style="flex-basis:40px">이동</label>
        <input id="ringDx" class="mini" style="width:52px" type="number" step="0.5" value="0" title="가로 이동 (mm, +오른쪽)">
        <input id="ringDy" class="mini" style="width:52px" type="number" step="0.5" value="0" title="세로 이동 (mm, +위)">
        <button class="btn small" id="ringReset" title="자동 위치로">↺</button></div>
    </div>
  </aside>
</main>
<dialog id="prefs">
  <form method="dialog">
    <h3>설정</h3>
    <div class="row"><label for="pDimColor">치수 색</label><input type="color" id="pDimColor" value="#1d5fd6">
      <select id="pDimSize" class="grow" aria-label="치수 글자 크기"><option value="0.85">작은 글씨</option><option value="1">보통 글씨</option><option value="1.3">큰 글씨</option></select></div>
    <div class="row"><label for="pBg2d">2D 배경</label><select id="pBg2d" class="grow"><option value="checker">체크무늬</option><option value="white">흰색</option><option value="gray">회색</option></select></div>
    <div class="row"><label for="pBg3d">3D 배경</label><select id="pBg3d" class="grow"><option value="light">밝게</option><option value="dark">어둡게</option></select></div>
    <label class="chk"><input type="checkbox" id="pHints"> 마우스를 올리면 영어 용어도 표시</label>
    <label class="chk"><input type="checkbox" id="pAutosave"> 마지막 작업 자동 저장</label>
    <div class="row" style="margin-top:8px">
      <button type="button" class="btn small" id="pResetCtl" title="왼쪽·오른쪽 설정을 처음 값으로 (글자·이미지는 그대로)">작업 설정 처음값으로</button>
      <button type="button" class="btn small" id="pResetPrefs">이 창 기본값</button></div>
    <div class="row" style="justify-content:flex-end;margin-bottom:0"><button class="btn pri small" value="close">닫기</button></div>
  </form>
</dialog>
<!--BUNDLE-->
</body>
</html>
